<style>

  --ink:#16203A; --ink-2:#4B5570; --ink-3:#818AA0;
  --line:#E2DACA; --line-2:#CDC3AE;
  --copper:#9A6A1C; --copper-soft:#F6E9CD;
  --teal:#2F6D5B; --teal-soft:#DDEBE3;
  --warn:#8A6A12; --warn-soft:#F7EDD2;
  --band:#1C2541;
  --radius:10px;
  --maxw:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1424; --sheet:#161E33; --sheet-2:#131A2C;
    --ink:#ECEAE2; --ink-2:#B4BACB; --ink-3:#868DA3;
    --line:#26304A; --line-2:#333E5C;
    --copper:#DFB45F; --copper-soft:#2E2718;
    --teal:#71BFA2; --teal-soft:#152A25;
    --warn:#D9B45C; --warn-soft:#2E2718;
    --band:#0B1326;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1424; --sheet:#161E33; --sheet-2:#131A2C;
  --ink:#ECEAE2; --ink-2:#B4BACB; --ink-3:#868DA3;
  --line:#26304A; --line-2:#333E5C;
  --copper:#DFB45F; --copper-soft:#2E2718;
  --teal:#71BFA2; --teal-soft:#152A25;
  --warn:#D9B45C; --warn-soft:#2E2718;
  --band:#0B1326;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,sans-serif; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Bitter,Georgia,"Times New Roman",serif; font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,44px); line-height:1.15}
h2{font-size:clamp(21px,2.6vw,28px)}
h3{font-size:17px}
p{margin:0}
a{color:var(--copper)}
.wrap{max-width:var(--maxw); margin:0 auto; padding-inline:18px}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* ── шапка ── */
.hero{background:var(--band); color:#EFEDE4; padding-block:clamp(30px,6vw,58px) clamp(26px,5vw,44px)}
.hero h1{color:#FFF}
.hero h1 em{font-style:normal; color:#D8A94A}
.hero p{color:#B9C0D4; max-width:62ch; margin-top:12px}
.hero .wrap{display:grid; gap:18px}
.brandline{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#96A0BC; font-size:13px}
.brandline b{color:#EFEDE4}
.topline{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
.langs{display:flex; gap:6px}
.lang{font:inherit; font-size:13px; padding:5px 12px; border-radius:999px; cursor:pointer;
  background:transparent; color:#96A0BC; border:1px solid #33406A}
.lang[aria-pressed="true"]{background:#D8A94A; color:#1C2541; border-color:#D8A94A; font-weight:600}
.lang:focus-visible{outline:2px solid #D8A94A; outline-offset:2px}
.facts{display:flex; gap:26px; flex-wrap:wrap; margin-top:6px}
.fact{border-left:2px solid #D8A94A; padding-left:12px}
.fact b{display:block; font-family:Bitter,Georgia,serif; font-size:21px; color:#FFF}
.fact span{font-size:12.5px; color:#96A0BC}

/* ── рабочая зона ── */
.work{padding-block:clamp(26px,4vw,40px)}
.grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:22px; align-items:start}
@media (max-width:900px){ .grid{grid-template-columns:1fr} }

.panel{background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius)}
.panel > .ph{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.panel > .pb{padding:16px 18px}

.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px}
@media (max-width:640px){ .tabs{grid-template-columns:repeat(2,1fr)} }
.tab{display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 8px; cursor:pointer;
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); color:var(--ink-2);
  font:inherit; font-size:13.5px; font-weight:500; line-height:1.25; text-align:center; opacity:.82;
  transition:opacity .15s ease, border-color .15s ease}
.tab svg{width:30px; height:30px; color:var(--ink-2)}
.tab:hover{opacity:1; border-color:var(--copper)}
.tab[aria-selected="true"]{opacity:1; background:var(--band); border:1px solid var(--band); color:#FFF; font-weight:600;
  box-shadow:var(--shadow, 0 6px 18px -10px rgba(16,24,58,.45))}
.tab[aria-selected="true"] svg{color:#D8A94A}
.tab[aria-selected="true"]::after{content:""; width:26px; height:2px; background:#D8A94A; border-radius:2px}
.tab:focus-visible{outline:2px solid var(--copper); outline-offset:2px}
.tabs-note{font-size:12.5px; color:var(--ink-3); margin:-10px 0 18px}
.mhead{display:grid; grid-template-columns:76px 1fr 72px 72px; gap:6px; font-size:11px; color:var(--ink-3); padding:0 2px 4px}
.mrow{display:grid; grid-template-columns:76px 1fr 72px 72px; gap:6px; margin-bottom:6px; align-items:center}
.mrow .mlab{font-size:12px; color:var(--ink-3)}
.mrow input{padding:7px 8px; font-size:14px}
@media (max-width:520px){ .mhead{display:none} .mrow{grid-template-columns:1fr 1fr 1fr; } .mrow .mlab{grid-column:1/-1} }
.art{display:flex; align-items:center; gap:14px}
.art svg{width:44px; height:44px; flex:none}
.art-otp svg{color:#2E86A8} .art-bol svg{color:#B03A3A} .art-dek svg{color:#9A5BA6}
.modes{display:flex; gap:0; margin-bottom:14px; border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
.mode{flex:1; font:inherit; font-size:13.5px; padding:9px 10px; cursor:pointer; background:var(--sheet-2); color:var(--ink-2); border:0}
.mode + .mode{border-left:1px solid var(--line-2)}
.mode[aria-pressed="true"]{background:var(--band); color:#EFEDE4; font-weight:600}
.mode:focus-visible{outline:2px solid var(--copper); outline-offset:-2px}
.fields{display:grid; gap:12px}
.f{display:grid; gap:5px}
.f label{font-size:13px; color:var(--ink-2); font-weight:500}
.f .hint{font-size:11.5px; color:var(--ink-3); line-height:1.45}
input,select{
  width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--sheet-2);
  border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; font-variant-numeric:tabular-nums;
}
input:focus-visible,select:focus-visible{outline:2px solid var(--copper); outline-offset:1px}
input:disabled,select:disabled{opacity:.42; cursor:not-allowed}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:460px){ .row2{grid-template-columns:1fr} }
details.more{border-top:1px dashed var(--line); margin-top:4px; padding-top:12px}
details.more summary{cursor:pointer; font-size:13.5px; color:var(--copper); font-weight:500; list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "; font-weight:600}
details.more[open] summary::before{content:"− "}
details.more .fields{margin-top:12px}

/* ── расчётный лист ── */
.sheet{background:var(--sheet); border:1px solid var(--line-2); border-radius:var(--radius); overflow:hidden; position:sticky; top:env(safe-area-inset-top, 0px)}
@media (max-width:900px){ .sheet{position:static} }
.sheet-head{background:var(--sheet-2); padding:14px 18px; border-bottom:1px solid var(--line)}
.sheet-head .who{font-family:Bitter,Georgia,serif; font-size:17px}
.sheet-head .meta{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.lines{padding:6px 18px 12px}
.line{display:flex; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px dotted var(--line)}
.line:last-child{border-bottom:0}
.line .t{flex:1; font-size:14px; color:var(--ink-2)}
.line .v{font-variant-numeric:tabular-nums; font-weight:600; font-size:15px; white-space:nowrap}
.line .why{flex-basis:100%; font-size:11.5px; color:var(--ink-3); margin-top:-2px}
.line.sub .t{padding-left:14px; color:var(--ink-3); font-size:13px}
.line.tot{border-top:2px solid var(--ink); border-bottom:0; margin-top:6px; padding-top:10px}
.line.tot .t{font-weight:600; color:var(--ink); font-size:15px}
.line.tot .v{font-size:19px; font-family:Bitter,Georgia,serif}
.group-h{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:14px 0 2px; border-bottom:1px solid var(--line)}
.stamp{margin:0 18px 18px; border:2px solid var(--copper); border-radius:8px; background:var(--copper-soft); padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
.stamp .l{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--copper); font-weight:600}
.stamp .s{font-family:Bitter,Georgia,serif; font-size:clamp(24px,4vw,32px); font-variant-numeric:tabular-nums; color:var(--ink)}
.note{margin:0 18px 16px; border-left:3px solid var(--warn); background:var(--warn-soft); color:var(--ink); padding:9px 12px; font-size:13px; border-radius:0 6px 6px 0}
.note.teal{border-left-color:var(--teal); background:var(--teal-soft)}

/* ── секции ── */
.sec{padding-block:clamp(28px,4.5vw,46px); border-top:1px solid var(--line)}
.sec.alt{background:var(--sheet-2)}
.sec h2 + p{margin-top:10px; color:var(--ink-2); max-width:70ch}
.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:22px}
.step{border-top:2px solid var(--teal); padding-top:12px}
.step .n{font-size:11px; letter-spacing:.12em; color:var(--teal); font-weight:600}
.step h3{margin:4px 0 6px}
.step p{font-size:14px; color:var(--ink-2)}
.law{margin-top:22px; display:grid; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--sheet)}
.law div{display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:14px; padding:11px 16px; border-bottom:1px solid var(--line); font-size:14px}
.law div:last-child{border-bottom:0}
.law b{font-weight:600; color:var(--ink)}
.law span{color:var(--ink-2)}
@media (max-width:620px){ .law div{grid-template-columns:1fr; gap:3px} }
.cta{display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; align-items:center}
.btn{display:inline-block; background:var(--copper); color:#FFF; text-decoration:none; padding:11px 20px; border-radius:8px; font-weight:600; font-size:15px}
.btn.ghost{background:transparent; color:var(--copper); border:1px solid var(--copper)}
footer{background:var(--band); color:#96A0BC; padding-block:26px; font-size:13px}
footer b{color:#EFEDE4}
footer a{color:#D8A94A}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

let L="ru";
try{ const saved=localStorage.getItem("esep-lang"); if(saved&&T[saved]) L=saved; }catch(e){}
const LI={ru:0,kg:1,en:2};
const loc=()=>L==="en"?"en-US":"ru-RU";
const f=n=>(Math.round(n*100)/100).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(Math.round(v*10000)/100).toLocaleString(loc())+"%";
const val=id=>{const v=parseFloat(($(id).value+"").replace(",",".")); return isFinite(v)?v:0;};
const dec=n=>String(n).replace(".", L==="en"?".":",");

const regionSel=$("region"), catSel=$("cat"), regSel=$("regime"), formaSel=$("forma"),
      rayonSel=$("rayon"), villageSel=$("village");
SMZ.forEach((r,i)=>regionSel.add(new Option(r[0],i)));
regionSel.value=String(Math.max(0,SMZ.findIndex(r=>r[0]==="г.Ош")));

function fillSelects(){
  const keepCat=catSel.value||"0", keepReg=regSel.value||"0", keepForma=formaSel.value||"oklad";
  catSel.innerHTML=""; CATS.forEach((c,i)=>catSel.add(new Option(c[0]+" — "+CAT_NAMES[c[0]][LI[L]],i)));
  catSel.value=keepCat;
  regSel.innerHTML=""; REGIMES.forEach((r,i)=>regSel.add(new Option(REG_NAMES[i][LI[L]],i)));
  regSel.value=keepReg;
  formaSel.innerHTML=""; Object.keys(FORM_NAMES).forEach(k=>formaSel.add(new Option(FORM_NAMES[k][LI[L]],k)));
  formaSel.value=keepForma;
}

const vgPct=y=>y<5?0:y<10?.05:y<15?.10:y<20?.15:y<25?.20:y<30?.25:.30;
function fillRayons(){
  const keep=rayonSel.value;
  rayonSel.innerHTML="";
  rayonSel.add(new Option(T[L].notApply,"—"));
  Object.keys(REGIONS).sort((a,b)=>a.localeCompare(b,"ru")).forEach(r=>rayonSel.add(new Option(r,r)));
  if(keep) rayonSel.value=keep;
}
function fillVillages(){
  const r=rayonSel.value, keep=villageSel.value;
  villageSel.innerHTML="";
  if(r==="—"){ villageSel.add(new Option(T[L].notApply,"—")); villageSel.disabled=true; return; }
  villageSel.disabled=false;
  REGIONS[r].forEach((v,i)=>villageSel.add(new Option(v[0]+" — "+dec(v[1]),i)));
  if(keep&&keep!=="—"&&REGIONS[r][+keep]) villageSel.value=keep;
}
function currentRk(){
  const r=rayonSel.value;
  if(r==="—"||villageSel.value==="—") return {k:1,name:"",src:""};
  const v=REGIONS[r][+villageSel.value];
  return v?{k:v[1],name:v[0],src:v[2]}:{k:1,name:"",src:""};
}

function renderStatic(){
  const t=T[L];
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v=t[el.dataset.i18n]; if(v!==undefined) el.innerHTML=v; });
  document.querySelectorAll("[data-i18n-opt]").forEach(el=>{ const v=t[el.dataset.i18nOpt]; if(v!==undefined) el.textContent=v; });
  $("steps").innerHTML=t.steps.map(s=>'<div class="step"><div class="n">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>').join("");
  $("law").innerHTML=t.law.map(r=>'<div><b>'+r[0]+'</b><span>'+r[1]+'</span></div>').join("");
  document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===L)));
  document.documentElement.lang = L==="kg"?"ky":L;
}

function toggleFields(){
  const fo=OKLAD_LAB[formaSel.value]?formaSel.value:"oklad";
  $("oklad").disabled=(fo==="sdel"||MODE==="back");
  $("normaCh").disabled=(fo!=="oklad");
  $("faktCh").disabled=!(fo==="chas"||fo==="sdel");
  $("sdelKol").disabled=$("sdelCena").disabled=(fo!=="sdel");
  $("okladLab").textContent=OKLAD_LAB[fo][LI[L]];
}

let MODE="fwd";
function calc(okladArg, silent){
  const t=T[L];
  if(!CATS[+catSel.value]||!REGIMES[+regSel.value]) return 0;
  if(!silent) toggleFields();
  const reg=REGIMES[+regSel.value], cat=CATS[+catSel.value], smzRow=SMZ[+regionSel.value];
  const smzFull=smzRow[1], smzUsech=smzRow[2];
  const [,,stPf,stGnpf,low,minVznF,minPnF,vzRabF,pnF,vychF,polisSmz,polisPay]=cat;
  const [,tarif,tarifLow,porog,dolyaSmz,minPnReg,pnOtSmz]=reg;

  const fo=formaSel.value, oklad=(okladArg===undefined?val("oklad"):okladArg), normaDn=Math.max(1,val("normaDn")), faktDn=val("faktDn"),
        normaCh=Math.max(1,val("normaCh")), faktCh=val("faktCh");
  let tarifChast=0, chas=0;
  if(fo==="oklad"){ tarifChast=oklad/normaDn*faktDn; chas=oklad/normaCh; }
  else if(fo==="chas"){ tarifChast=oklad*faktCh; chas=oklad; }
  else if(fo==="den"){ tarifChast=oklad*faktDn; chas=oklad/8; }
  else if(fo==="sdel"){ tarifChast=val("sdelKol")*val("sdelCena"); chas=faktCh?tarifChast/faktCh:0; }
  else { tarifChast=oklad; chas=faktCh?oklad/faktCh:0; }

  const oplSv=chas*(1.5*val("sv1")+2*val("sv2"));
  const oplNoch=chas*.5*val("noch");
  const oplPr=chas*val("prazd");
  const oplSovm=tarifChast*val("sovm")/100;
  const oplVred=tarifChast*val("vred")/100;
  const oplStazh=tarifChast*val("stazhp")/100;
  const RK=currentRk(), rk=Math.max(1,RK.k);
  const vgP=rk>1?vgPct(val("vgs")):0;
  const oplVg=tarifChast*vgP;
  const doRk=tarifChast+oplSv+oplNoch+oplPr+oplSovm+oplVred+oplStazh+oplVg+val("premia");
  const sRk=doRk*rk;
  const dopMzp=(faktDn>=normaDn&&sRk<MZP)?MZP-sRk:0;
  const nach=Math.round((sRk+dopMzp)*100)/100;

  const dolyaMes=Math.min(1,faktDn/normaDn);
  const smzPropPn=Math.round(smzFull*dolyaMes*100)/100;
  const smzVzn=smzFull;

  const bazaWork=dolyaSmz>0?smzVzn*dolyaSmz:nach;
  const pf=Math.round(bazaWork*stPf*100)/100, gnpf=Math.round(bazaWork*stGnpf*100)/100;
  const polis=Math.round((polisSmz>0?smzUsech*polisSmz:(polisPay>0?nach*polisPay:0))*100)/100;
  const vznWork=pf+gnpf+polis;

  const minVzn=minVznF&&porog>0;
  const dopFot=minVzn?Math.max(0,Math.round((porog*smzVzn*dolyaMes-nach)*100)/100):0;
  const bazaRab=dolyaSmz>0?smzVzn*dolyaSmz:nach+dopFot;
  const vznRab=vzRabF?Math.round(bazaRab*(low?tarifLow:tarif)*100)/100:0;

  const neobl=Math.round((oplVg+Math.max(0,sRk-doRk))*100)/100;
  const oblag=Math.max(0,Math.round((nach-neobl)*100)/100);
  const vznObl=nach>0?Math.round(vznWork*oblag/nach*100)/100:0;
  const vychStd=vychF===2?VYCH_LICH+VYCH_IJD*val("ijd"):0;
  const vychNpf=Math.min(val("npf"),Math.round(PRED_NPF*oblag*100)/100);
  const bazaFact=Math.max(0,oblag-(vychF===0?0:vznObl)-vychStd-vychNpf);
  const minPn=minPnF&&minPnReg;
  const bazaItog=(minPn&&bazaFact<smzPropPn)?smzPropPn:bazaFact;
  const pn=!pnF?0:(pnOtSmz>0?Math.round(smzPropPn*pnOtSmz*100)/100:Math.round(bazaFact*ST_PN*100)/100);
  const pnDop=(!pnF||pnOtSmz>0)?0:Math.round(Math.max(0,bazaItog-bazaFact)*ST_PN*100)/100;
  const pnGns=pn+pnDop;

  const alim=Math.round(Math.max(0,nach-vznWork-pn)*val("alim")/100*100)/100;
  const uder=vznWork+pn+alim+val("prochie");
  const net=Math.round((nach-uder-val("avans"))*100)/100;
  const cost=nach+vznRab+pnDop;

  if(silent) return net;

  $("shWho").textContent=cat[0]+" · "+CAT_NAMES[cat[0]][LI[L]];
  $("shMeta").textContent=smzRow[0]+" · "+t.smzFull+" "+f(smzFull)+" · "+t.smzVzn+" "+f(smzUsech)
    +(rk>1?" · "+RK.name+", "+t.coefOf+" "+dec(rk):"");
  $("rkHint").textContent=rk>1
    ? t.coefOf+" "+dec(rk)+" · "+(RK.src==="сумма"?t.rkSum:t.rkRes+" "+RK.src)
    : t.rkNone;

  const Lr=[];
  const add=(ttl,v,why,cls)=>Lr.push('<div class="line '+(cls||"")+'"><span class="t">'+ttl+'</span><span class="v num">'+f(v)+"</span>"+(why?'<span class="why">'+why+"</span>":"")+"</div>");
  const grp=x=>Lr.push('<div class="group-h">'+x+"</div>");

  if(MODE==="back") add(t.rBack,nach,t.rBackWhy,"tot");
  grp(t.gEarn);
  add(t.rTarif,tarifChast, fo==="oklad"?f(oklad)+" ÷ "+normaDn+" "+t.wDays+" × "+faktDn+" "+t.wDays:"");
  if(oplSv) add(t.rSv,oplSv,f(chas)+" × 1,5 × "+val("sv1")+" "+t.wHours+" + "+f(chas)+" × 2 × "+val("sv2")+" "+t.wHours,"sub");
  if(oplNoch) add(t.rNoch,oplNoch,f(chas)+" × 50% × "+val("noch")+" "+t.wHours,"sub");
  if(oplPr) add(t.rPrazd,oplPr,f(chas)+" × 100% × "+val("prazd")+" "+t.wHours,"sub");
  if(oplSovm) add(t.rSovm,oplSovm,"","sub");
  if(oplVred) add(t.rVred,oplVred,"","sub");
  if(oplStazh) add(t.rStazh,oplStazh,"","sub");
  if(oplVg) add(t.rVg,oplVg,pct(vgP)+" "+t.wVgWhy,"sub");
  if(rk>1) add(t.rRk,sRk-doRk,RK.name+" · × "+dec(rk)+" · "+(RK.src==="сумма"?t.rkSum:t.rkRes+" "+RK.src),"sub");
  if(dopMzp) add(t.rMzp,dopMzp,t.wMzp+" "+f(MZP),"sub");
  add(t.rTotal,nach,"","tot");

  grp(t.gHold);
  if(pf) add(t.rPf+" "+pct(stPf),pf,f(bazaWork)+" × "+pct(stPf));
  if(gnpf) add(t.rGnpf+" "+pct(stGnpf),gnpf,f(bazaWork)+" × "+pct(stGnpf));
  if(!pf&&!gnpf&&!polis) add(t.rNoVzn,0,t.rNoVznWhy);
  if(polis) add(t.rPolis+" "+pct(polisSmz>0?polisSmz:polisPay),polis,
    polisSmz>0?t.wSmzUsech+" "+f(smzUsech)+" × "+pct(polisSmz):t.wPayment+" "+f(nach)+" × "+pct(polisPay));
  add(t.rPn,pn,!pnF?t.wNoPn:(pnOtSmz>0?t.wFromSmz+" "+f(smzPropPn)+" × "+pct(pnOtSmz):f(bazaFact)+" × 10% ("+t.wBase+")"));
  if(neobl>0) Lr.push('<div class="line"><span class="t" style="color:var(--teal)">'+t.rNeobl+'</span><span class="v num">'+f(neobl)+'</span><span class="why">'+t.wNeoblWhy+"</span></div>");
  if(alim) add(t.rAlim+" "+val("alim")+"%",alim,"");
  if(val("prochie")) add(t.rProch,val("prochie"),"");
  if(val("avans")) add(t.rAvans,val("avans"),"");
  add(t.rHoldTotal,uder+val("avans"),"","tot");

  $("shLines").innerHTML=Lr.join("");
  $("shNet").textContent=f(net);

  const note=$("shNote");
  if(pnDop>0){
    note.hidden=false;
    note.innerHTML=t.noteDop.replace("{dop}",f(pnDop)).replace("{base}",f(bazaFact))
      .replace("{smz}",f(smzPropPn)).replace("{gns}",f(pnGns)).replace("{pn}",f(pn)).replace("{dop}",f(pnDop));
  } else if(!pnF){ note.hidden=false; note.innerHTML=t.noteIp; }
  else note.hidden=true;

  $("shEmp").innerHTML=t.emp.replace("{vzn}",f(vznRab))
    .replace("{dopfot}",dopFot>0?t.empDopfot.replace("{b}",f(bazaRab)):"")
    .replace("{pndop}",pnDop>0?t.empPndop.replace("{p}",f(pnDop)):"")
    .replace("{cost}",f(cost));
  return net;
}

function solve(target){
  let lo=0, hi=5e6;
  for(let i=0;i<70;i++){
    const mid=(lo+hi)/2;
    (calc(mid,true) < target) ? lo=mid : hi=mid;
  }
  return Math.round((lo+hi)/2*100)/100;
}
function run(){
  if(MODE==="back"){
    if(formaSel.value==="sdel"){ formaSel.value="summa"; }
    const x=solve(val("netTarget"));
    $("oklad").value=x.toFixed(2);
    calc(x,false);
  } else calc(undefined,false);
}
function setMode(m, skipRun){
  MODE=m;
  $("wrapNet").hidden=(m!=="back");
  document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)));
  $("oklad").disabled=(m==="back");
  if(!skipRun) run();
}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));


// ═══════════ отпускные, больничный, декретные ═══════════
const DEK_CASES=[
 [["Обычные роды","Кадимки төрөт","Normal birth"],126,140,[70,56],[70,70]],
 [["Осложнённые роды","Татаалдашкан төрөт","Complicated birth"],140,156,[70,70],[70,86]],
 [["Рождение двух и более детей","Эки жана андан көп бала","Twins or more"],140,180,[70,70],[70,110]]
];
// ── производственный календарь: выходные суббота-воскресенье и нерабочие праздники КР ──
const HOL_FIX=["01-01","01-07","02-23","03-08","03-21","04-07","05-01","05-05","05-09","08-31","11-07","11-08"];
const HOL_MOV={2025:["03-30","06-06"],2026:["03-20","05-27"],2027:["03-09","05-16"],2028:["02-26","05-05"]};
const md=d=>String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function isHoliday(d){ const m=md(d); return HOL_FIX.indexOf(m)>=0 || (HOL_MOV[d.getFullYear()]||[]).indexOf(m)>=0; }
function scanDays(start,days){
  let rab=0, prz=0; const d=new Date(start.getTime());
  for(let i=0;i<days;i++){ const w=d.getDay();
    if(w!==0&&w!==6){ if(isHoliday(d)) prz++; else rab++; }
    d.setDate(d.getDate()+1); }
  return {rab:rab, prz:prz};
}
function addDays(start,days){ const d=new Date(start.getTime()); d.setDate(d.getDate()+days-1); return d; }
const fmtD=d=>String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
function startDate(){
  const el=$("dek_start");
  if(!el.value){ const t=new Date(); el.value=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
  const p=el.value.split("-");
  return new Date(+p[0],+p[1]-1,+p[2]);
}
function lineTxt(ttl,txt,why,cls){
  return '<div class="line '+(cls||"")+'"><span class="t">'+ttl+'</span><span class="v">'+txt+"</span>"
    +(why?'<span class="why">'+why+"</span>":"")+"</div>";
}
const POS_BOL=10000, POS_DEK=2000, RAB_MES=21.2, KOEF_KAL=29.6, DNEY_RAB=10;
const mv=(p,k,i)=>val(p+"_"+k+i);

function lineHTML(ttl,v,why,cls){
  return '<div class="line '+(cls||"")+'"><span class="t">'+ttl+'</span><span class="v num">'+f(v)+"</span>"
    +(why?'<span class="why">'+why+"</span>":"")+"</div>";
}

function calcOtp(){
  const t=T[L];
  let summa=0, dney=0;
  for(let i=1;i<=3;i++){
    const nach=mv("otp","nach",i), kal=Math.max(1,mv("otp","kal",i)), prz=mv("otp","prz",i);
    summa+=nach;
    const baseDays=Math.max(1,kal-prz);
    dney+=KOEF_KAL*Math.max(0,kal-prz)/baseDays;
  }
  dney=Math.round(dney*100)/100;
  const sdz=dney?Math.round(summa/dney*100)/100:0;
  const dniOpl=Math.max(0,val("otp_dni")-val("otp_prz"));
  const nach=Math.round(sdz*dniOpl*100)/100;
  const vzn=Math.round(nach*.1*100)/100;
  const vych=VYCH_LICH+VYCH_IJD*val("otp_ijd");
  const baza=Math.max(0,nach-vzn-vych);
  const pn=Math.round(baza*ST_PN*100)/100;
  const net=Math.round((nach-vzn-pn)*100)/100;
  $("otpLines").innerHTML=[
    lineHTML(t.rZarab,summa,""),
    lineHTML(t.rDney,dney,"29,6 × "+t.c_kal),
    lineHTML(t.rSdz,sdz,f(summa)+" ÷ "+f(dney)),
    lineHTML(t.rDniOpl,dniOpl,""),
    lineHTML(t.rOtpNach,nach,f(sdz)+" × "+dniOpl,"tot"),
    lineHTML(t.rVzn10,vzn,""),
    lineHTML(t.rVych,vych,""),
    lineHTML(t.rBaza,baza,f(nach)+" − "+f(vzn)+" − "+f(vych)),
    lineHTML(t.rPn,pn,f(baza)+" × 10%")
  ].join("");
  $("otpNet").textContent=f(net);
  $("otpNote").innerHTML=t.otpNote;
}

function calcBol(){
  const t=T[L];
  let summa=0, rab=0;
  for(let i=1;i<=3;i++){ summa+=mv("bol","nach",i); rab+=mv("bol","kal",i); }
  const sdz=rab?Math.round(summa/rab*100)/100:0;
  const st=val("bol_stazh");
  const vg=$("bol_vg")&&$("bol_vg").value==="1";
  const zpMes=Math.round(summa/3*100)/100;
  const polnoe=vg||zpMes<=POS_BOL;                 // п. 37 подп. 1 и п. 40 Положения
  const proc=polnoe?1:(st<5?.6:st<8?.8:1);
  const dnevn=Math.round(sdz*proc*100)/100;
  const dni=val("bol_dni");
  const rows=[
    lineHTML(t.rZarab,summa,""),
    lineHTML(t.rRabDni,rab,""),
    lineHTML(t.rSdz,sdz,f(summa)+" ÷ "+f(rab))
  ];
  let nach;
  if(polnoe){
    nach=Math.round(sdz*dni*100)/100;
    rows.push(lineHTML(t.rProc,1,vg?t.rVgFull:t.bolLow));
    rows.push(lineHTML(t.rB10,nach,f(sdz)+" × "+dni+" · "+t.wAllDays));
  }else{
    const dniR=Math.min(dni,DNEY_RAB), dniB=Math.max(0,dni-DNEY_RAB);
    const chastR=Math.round(dnevn*dniR*100)/100;
    const stavkaB=Math.round(POS_BOL/RAB_MES*100)/100;
    const chastB=Math.round(stavkaB*dniB*100)/100;
    nach=Math.round((chastR+chastB)*100)/100;
    rows.push(lineHTML(t.rProc,proc,pct(proc)+" · "+t.bol_stazh.toLowerCase()+" "+st));
    rows.push(lineHTML(t.rDnevn,dnevn,f(sdz)+" × "+pct(proc)));
    rows.push(lineHTML(t.rB10,chastR,f(dnevn)+" × "+dniR));
    rows.push(lineHTML(t.rStavkaBud,stavkaB,f(POS_BOL)+" ÷ "+f(RAB_MES)));
    rows.push(lineHTML(t.rB11,chastB,dniB?f(stavkaB)+" × "+dniB:"—"));
  }
  rows.push(lineHTML(t.rPosob,nach,"","tot"));
  $("bolLines").innerHTML=rows.join("");
  $("bolNet").textContent=f(nach);
  $("bolNote").innerHTML=t.bolNote;
}

function fillDekCases(){
  const sel=$("dek_case"), keep=sel.value||"0";
  sel.innerHTML="";
  const vgSel=$("dek_vg"), vg=vgSel&&vgSel.value==="1";
  DEK_CASES.forEach((c,i)=>sel.add(new Option(c[0][LI[L]]+" — "+(vg?c[2]:c[1]),i)));
  sel.value=keep;
  const dopSel=$("dek_dop"), keepD=dopSel.value||"0";
  dopSel.innerHTML="";
  dopSel.add(new Option(T[L].no,"0")); dopSel.add(new Option(T[L].yes,"1"));
  dopSel.value=keepD;
}

function calcDek(){
  const t=T[L];
  let summa=0, rab=0;
  for(let i=1;i<=3;i++){ summa+=mv("dek","nach",i); rab+=mv("dek","kal",i); }
  const sdz=rab?Math.round(summa/rab*100)/100:0;
  const cs=DEK_CASES[+$("dek_case").value||0];
  const vg=$("dek_vg")&&$("dek_vg").value==="1";
  const dniKal=vg?cs[2]:cs[1];
  const start=startDate();
  const end=addDays(start,dniKal);
  const sc=scanDays(start,dniKal);
  const korr=val("dek_prz");
  const dniRab=Math.max(0,sc.rab+korr);
  const dniR=Math.min(dniRab,DNEY_RAB), dniB=Math.max(0,dniRab-DNEY_RAB);
  const chastR=Math.round(sdz*dniR*100)/100;
  const stavkaB=vg?sdz:Math.round(POS_DEK/RAB_MES*100)/100;
  const chastB=Math.round(stavkaB*dniB*100)/100;
  const dopl=(!vg&&$("dek_dop").value==="1")?Math.round(Math.max(0,(sdz-stavkaB)*dniB)*100)/100:0;
  const nach=Math.round((chastR+chastB+dopl)*100)/100;
  const rows=[
    lineHTML(t.rZarab,summa,""),
    lineHTML(t.rRabDni,rab,""),
    lineHTML(t.rSdz,sdz,f(summa)+" ÷ "+f(rab)),
    lineTxt(t.rPeriod,fmtD(start)+" — "+fmtD(end),cs[0][LI[L]]+" · "+(vg?cs[4]:cs[3])[0]+" "+t.wBefore+" + "+(vg?cs[4]:cs[3])[1]+" "+t.wAfter+(vg?" · "+t.l_vg_zone.toLowerCase():"")),
    lineHTML(t.rDniKal,dniKal,""),
    lineHTML(t.rDniPrz,sc.prz,""),
    lineHTML(t.rDniRabOpl,dniRab,korr?f(sc.rab)+" "+(korr>0?"+":"−")+" "+Math.abs(korr):""),
    lineHTML(t.rChastRab,chastR,f(sdz)+" × "+dniR)
  ];
  if(vg){
    rows.push(lineHTML(t.rBudgetVg,chastB,dniB?f(sdz)+" × "+dniB+" · "+t.rVgFull:"—"));
  }else{
    rows.push(lineHTML(t.rStavkaBud,stavkaB,f(POS_DEK)+" ÷ "+f(RAB_MES)));
    rows.push(lineHTML(t.rChastBud,chastB,dniB?f(stavkaB)+" × "+dniB:"—"));
    rows.push(lineHTML(t.rDopl,dopl,dopl?f(sdz-stavkaB)+" × "+dniB:"—"));
  }
  rows.push(lineHTML(t.rPosob,nach,"","tot"));
  $("dekLines").innerHTML=rows.join("");
  $("dekNet").textContent=f(nach);
  $("dekNote").innerHTML=t.dekNote;
}

let TAB="pay";
function setTab(x, skipRun){
  TAB=x;
  const panes={pay:"paneWage",otp:"paneOtp",bol:"paneBol",dek:"paneDek"};
  Object.keys(panes).forEach(k=>{ $(panes[k]).hidden=(k!==x); });
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===x)));
  if(!skipRun) runAll();
}
function runAll(){
  if(TAB==="pay") run();
  else if(TAB==="otp") calcOtp();
  else if(TAB==="bol") calcBol();
  else calcDek();
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
if($("dek_vg")) $("dek_vg").addEventListener("change",()=>{ fillDekCases(); calcDek(); });

function setLang(x){
  L=x;
  try{ localStorage.setItem("esep-lang",x); }catch(e){}
  renderStatic(); fillSelects(); fillRayons(); fillVillages(); fillDekCases(); runAll();
}
document.querySelectorAll(".lang").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
rayonSel.addEventListener("change",()=>{ fillVillages(); run(); });
document.querySelectorAll("input,select").forEach(el=>{ el.addEventListener("input",runAll); el.addEventListener("change",runAll); });
setMode("fwd", true);
setTab("pay", true);
setLang(L);
